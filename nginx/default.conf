server {
    listen 80;
    server_name _;

    # API и админка Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Загруженные файлы
    location /media/ {
        alias /var/www/media/;
    }

    # Статика Django (админка, DRF) — копируется в html/static при старте
    location /static/admin/ {
        alias /usr/share/nginx/html/static/admin/;
    }
    location /static/rest_framework/ {
        alias /usr/share/nginx/html/static/rest_framework/;
    }

    # Собранный React: index.html и static/js, static/css
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
